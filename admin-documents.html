<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridgefield — Document Verification</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#17201d;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px 20px}h1{font-size:clamp(2.4rem,6vw,5rem);margin:8px 0}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin:18px 0}.muted{opacity:.62}.btn{padding:10px 15px;border:0;border-radius:999px;background:#17201d;color:#fff;font-weight:700;cursor:pointer}input,select,textarea{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;width:100%;margin:6px 0 12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}.badge{padding:5px 8px;background:#ebe8df;border-radius:99px;font-size:.8rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="assets/phase50-official.css">
</head><body><main class="wrap"><div class="portal-brand-logo"><img src="assets/2026.png" alt="Ridgefield Academy"></div><div class="muted">RIDGEFIELD CMS</div><h1>Document Verification</h1>
<div class="panel"><label>Admin key</label><input id="key" type="password"><label>Application ID</label><input id="applicationId" type="number" placeholder="e.g. 1"><button class="btn" onclick="loadDocs()">View documents</button></div>
<div id="content"></div></main><script>
let k='';async function loadDocs(){k=key.value;let r=await fetch('/api/admin/applications/'+applicationId.value+'/documents',{headers:{'x-admin-key':k}});let d=await r.json();if(!r.ok)return alert(d.error||'Access denied');content.innerHTML=`<div class="panel"><h2>${d.application.application_ref}</h2><p>${d.application.applicant_first_name} ${d.application.applicant_last_name}</p><table><thead><tr><th>Document</th><th>File</th><th>Status</th><th>Review</th></tr></thead><tbody>${d.documents.map(x=>`<tr><td>${x.document_type}</td><td>${x.file_name}<br><span class="muted">${x.file_size||0} bytes</span></td><td><span class="badge">${x.status}</span></td><td><select id="s${x.id}">${d.allowedStatuses.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><textarea id="n${x.id}" placeholder="Admin note">${x.admin_note||''}</textarea><button class="btn" onclick="save(${x.id})">Save review</button></td></tr>`).join('')||'<tr><td colspan="4">No documents submitted.</td></tr>'}</tbody></table></div>`}
async function save(id){let r=await fetch('/api/admin/application-documents/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':k},body:JSON.stringify({status:document.getElementById('s'+id).value,adminNote:document.getElementById('n'+id).value})});let d=await r.json();if(!r.ok)return alert(d.error||'Unable to save');loadDocs()}
</script></body></html>
