<body>
<form name="ridgefield-application" netlify netlify-honeypot="bot-field" hidden>
<input name="form-name"><input name="bot-field"><input name="application-reference"><input name="application-source">
<input name="pathway"><input name="campus"><input name="grade-applying">
<input name="learner-first-name"><input name="learner-last-name"><input name="date-of-birth"><input name="current-school">
<textarea name="main-enquiry"></textarea>

<textarea name="quiz-summary"></textarea><textarea name="admin-summary"></textarea><input name="privacy-consent">
</form>

<form name="ridgefield-enquiry" netlify netlify-honeypot="bot-field" hidden>
<input name="form-name"><input name="bot-field"><input name="enquiry-reference">
<input name="name"><input name="email"><input name="phone"><input name="enquiry-type"><input name="pathway">
<input name="subject"><input name="urgency"><input name="preferred-contact"><textarea name="message"></textarea>
<textarea name="admin-summary"></textarea><input name="privacy-consent">
</form>
