<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridgefield — Admissions Management</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#17201d;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:30px 20px}h1{font-size:clamp(2.4rem,6vw,5rem);margin:8px 0}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin:18px 0}.muted{opacity:.62}.btn{padding:9px 14px;border:0;border-radius:999px;background:#17201d;color:#fff;font-weight:700;cursor:pointer}.login{max-width:600px;margin:80px auto}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:7px 0 15px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}.badge{padding:5px 8px;background:#ebe8df;border-radius:99px;font-size:.8rem}select{padding:7px;border-radius:7px;border:1px solid #ccc}@media(max-width:800px){table{font-size:.85rem}}
</style><link rel="stylesheet" href="assets/phase50-official.css">
</head><body><main class="wrap"><section id="login" class="login"><div class="portal-brand-logo"><img src="assets/2026.png" alt="Ridgefield Academy"></div><div class="muted">RIDGEFIELD CMS</div><h1>Admissions</h1><div class="panel"><label>Admin key</label><input id="key" type="password"><button class="btn" onclick="load()">Open admissions</button></div></section><section id="app" style="display:none"><div class="muted">ADMISSIONS MANAGEMENT</div><h1>Applications</h1><div class="panel" style="overflow:auto"><table><thead><tr><th>Reference</th><th>Applicant</th><th>Pathway / Campus</th><th>Grade</th><th>Parent</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let adminKey='';async function load(){adminKey=key.value;let r=await fetch('/api/admin/applications',{headers:{'x-admin-key':adminKey}});let d=await r.json();if(!r.ok){alert(d.error||'Access denied');return}login.style.display='none';app.style.display='block';rows.innerHTML=d.applications.map(a=>`<tr><td><b>${a.application_ref}</b><br><span class="muted">${a.created_at.slice(0,10)}</span></td><td>${a.applicant_first_name} ${a.applicant_last_name}</td><td>${a.pathway}<br><span class="muted">${a.campus}</span></td><td>${a.grade_applying}</td><td>${a.parent_name}<br>${a.parent_email}</td><td><span class="badge">${a.status}</span></td><td><select onchange="status(${a.id},this.value)"><option>${a.status}</option><option>Under Review</option><option>Documents Required</option><option>Interview</option><option>Accepted</option><option>Waitlisted</option><option>Declined</option><option>Enrolled</option></select>${a.status==='Accepted'?`<button class="btn" style="margin-top:7px" onclick="enrol(${a.id})">Enrol</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">No applications.</td></tr>'}
async function status(id,s){let r=await fetch('/api/admin/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':adminKey},body:JSON.stringify({status:s})});if(!r.ok){let d=await r.json();alert(d.error)}load()}
async function enrol(id){let r=await fetch('/api/admin/applications/'+id+'/enrol',{method:'POST',headers:{'x-admin-key':adminKey}});let d=await r.json();if(!r.ok){alert(d.error||'Unable to enrol');return}alert('Enrolled. Student reference: '+d.studentRef);load()}
</script></body></html>
